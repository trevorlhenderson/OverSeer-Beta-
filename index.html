<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>OverSeer</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="app">

    <!-- ================= HUB ================= -->

    <section id="hubScreen" class="screen">

        <div class="hub-background"></div>

        <div class="hub-content">

            <div class="logo">
                <span>OVER</span>SEER
            </div>

            <div class="subtitle">
                SURVIVE • ESCAPE • OUTSMART
            </div>

            <div class="character-preview">

                <div class="preview-shadow"></div>

                <div class="character">
                    <div class="hair"></div>
                    <div class="head"></div>
                    <div class="body"></div>
                    <div class="arm left"></div>
                    <div class="arm right"></div>
                    <div class="leg left"></div>
                    <div class="leg right"></div>
                </div>

            </div>

            <div class="player-card">

                <div class="avatar-small">
                    👤
                </div>

                <div>

                    <div class="player-name-display" id="hubUsername">
                        Player
                    </div>

                    <div class="player-level">
                        SURVIVOR • LEVEL 1
                    </div>

                </div>

            </div>

            <button id="playButton" class="main-button">
                PLAY
            </button>

            <div class="secondary-buttons">

                <button id="profileButton">
                    PROFILE
                </button>

                <button id="settingsButton">
                    SETTINGS
                </button>

            </div>

        </div>

    </section>


    <!-- ================= USERNAME ================= -->

    <section id="usernameScreen" class="screen hidden">

        <div class="username-panel">

            <div class="logo small">
                OVERSEER
            </div>

            <h1>CREATE YOUR PROFILE</h1>

            <p>
                Choose a username to enter the facility.
            </p>

            <input
                id="usernameInput"
                type="text"
                maxlength="16"
                autocomplete="off"
                placeholder="Enter username"
            >

            <div id="usernameMessage"></div>

            <button id="usernameButton" class="main-button">
                CONTINUE
            </button>

        </div>

    </section>


    <!-- ================= GAME ================= -->

    <section id="gameScreen" class="hidden">

        <canvas id="gameCanvas"></canvas>


        <!-- GAME HUD -->

        <div id="gameHUD">

            <div class="hud-top">

                <div class="hud-logo">
                    OVERSEER
                </div>

                <div class="objective-box">

                    <span>OBJECTIVES</span>

                    <strong id="objectiveCount">
                        0 / 5
                    </strong>

                </div>

            </div>


            <div class="player-hud">

                <div class="hud-avatar">
                    👤
                </div>

                <div class="hud-details">

                    <div id="hudUsername">
                        Player
                    </div>

                    <div class="role-label">
                        SURVIVOR
                    </div>

                    <div class="health-background">

                        <div
                            id="healthBar"
                            class="health-fill"
                        ></div>

                    </div>

                </div>

            </div>


            <div id="interactionPrompt" class="interaction-prompt">
                WASD MOVE • SHIFT SPRINT
            </div>


            <div class="controls">

                <div class="control">
                    <b>WASD</b>
                    <span>MOVE</span>
                </div>

                <div class="control">
                    <b>SHIFT</b>
                    <span>SPRINT</span>
                </div>

                <div class="control">
                    <b>E</b>
                    <span>INTERACT</span>
                </div>

            </div>

        </div>


        <!-- ROUND MESSAGE -->

        <div id="roundMessage" class="round-message hidden">

            <div id="roundMessageTitle">
                OBJECTIVES COMPLETE
            </div>

            <div id="roundMessageText">
                The escape door is now open.
            </div>

        </div>

    </section>

</div>

<script src="game.js"></script>

</body>
</html>
